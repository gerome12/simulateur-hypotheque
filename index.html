<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><link rel="icon" type="image/svg+xml" href="assets/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"></head><body>
<title>Simulateur hypothécaire suisse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : formulaire à gauche (le ménage, le bien, les fonds propres, les hypothèses), résultats à droite ; une colonne sur téléphone avec barre de synthèse en bas */
:root {
  --bg: #F3F5F7;
  --surface: #FFFFFF;
  --ink: #15191E;
  --muted: #5B6570;
  --line: #DCE1E6;
  --accent: #1F4F86;      /* bleu lac, pour les contrôles */
  --accent-soft: #E3ECF6;
  --swiss: #D52B1E;       /* uniquement pour la marque */
  --ok: #1E7A4C;  --ok-soft: #E2F2E9;
  --warn: #A86300; --warn-soft: #FBEFD9;
  --bad: #B3261E; --bad-soft: #F9E3E1;
  --c-eq: #2E7D6B; --c-r1: #1F4F86; --c-r2: #7FA3CF; --c-fee: #B7BFC8;
  --c-cash: #2E7D6B; --c-3a: #D49A2A; --c-lpp: #6B4FA0; --c-cash-dark: #164237; --c-ab: #7A5C3E;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101317; --surface: #191D22; --ink: #E7EAEE; --muted: #9AA4AF; --line: #2B3138;
    --accent: #84AEE6; --accent-soft: #1E2A3A; --swiss: #E5483B;
    --ok: #52C48E; --ok-soft: #15291F; --warn: #E4A63E; --warn-soft: #2D2312; --bad: #F2766A; --bad-soft: #321A18;
    --c-eq: #4FB39B; --c-r1: #5C8FD6; --c-r2: #9DBBE3; --c-fee: #5A636D; --c-cash: #4FB39B; --c-3a: #E2B45A; --c-lpp: #A58BDB; --c-cash-dark: #1F6352; --c-ab: #C9A47E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101317; --surface: #191D22; --ink: #E7EAEE; --muted: #9AA4AF; --line: #2B3138;
  --accent: #84AEE6; --accent-soft: #1E2A3A; --swiss: #E5483B;
  --ok: #52C48E; --ok-soft: #15291F; --warn: #E4A63E; --warn-soft: #2D2312; --bad: #F2766A; --bad-soft: #321A18;
  --c-eq: #4FB39B; --c-r1: #5C8FD6; --c-r2: #9DBBE3; --c-fee: #5A636D; --c-cash: #4FB39B; --c-3a: #E2B45A; --c-lpp: #A58BDB; --c-cash-dark: #1F6352; --c-ab: #C9A47E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 96px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 24px; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.brand { display: flex; gap: 14px; align-items: center; }
.cross { width: 34px; height: 34px; background: var(--swiss); border-radius: 4px; position: relative; flex: none; }
.cross::before, .cross::after { content: ""; position: absolute; background: #fff; left: 50%; top: 50%; transform: translate(-50%,-50%); }
.cross::before { width: 20px; height: 6px; } .cross::after { width: 6px; height: 20px; }
h1 { font-family: var(--font-display); font-stretch: 80%; font-weight: 800; font-size: clamp(26px, 4vw, 36px); line-height: 1.05; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; max-width: 62ch; }
.top-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
#taxCouple { margin: 10px 0 12px; }
.dossier-msg { margin: 0; padding: 8px 12px; border-radius: 8px; font-size: 13px; color: var(--bad); background: var(--bad-soft); }
.dossier-msg[role="status"] { color: var(--warn); background: var(--warn-soft); }
select, button { font: inherit; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); color: var(--surface); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); grid-template-areas: "inputs summary" "inputs details"; gap: 24px; align-items: start; }
.inputs { grid-area: inputs; display: grid; gap: 16px; min-width: 0; }
.summary { grid-area: summary; min-width: 0; display: grid; gap: 16px; }
.details { grid-area: details; min-width: 0; display: grid; gap: 16px; }
@media (max-width: 900px) {
  .grid { grid-template-columns: minmax(0,1fr); grid-template-areas: "summary" "inputs" "details"; }
}

.fold > summary { list-style: none; cursor: pointer; display: grid; gap: 2px; padding-right: 28px; position: relative; margin-bottom: 8px; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::after { content: ""; position: absolute; right: 4px; top: 6px; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .2s; }
.fold[open] > summary::after { transform: rotate(-135deg); top: 10px; }
.fold:not([open]) { padding-bottom: 10px; }
.fold:not([open]) > summary { margin-bottom: 0; }
.fold[open] .msum { display: none; }
.msum { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.msum b { color: var(--ink); font-weight: 600; }
.person .field, #f-menage2 .field { padding: 8px 0; }
@media (prefers-reduced-motion: reduce) { .fold > summary::after { transition: none; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 8px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-stretch: 85%; font-weight: 700; font-size: 17px; margin: 0 0 2px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel h2 small { font-family: var(--font-data); font-weight: 400; font-size: 12px; color: var(--muted); }
.panel .lead { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
@media (max-width: 520px) { .duo { grid-template-columns: 1fr; } }
.duo.people { gap: 12px; margin-bottom: 12px; }
.person { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 0; background: var(--bg); min-width: 0; }
.person h3 { font-family: var(--font-display); font-stretch: 85%; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 2px; }
.split { margin: -2px 0 12px; display: grid; gap: 6px; }
.split-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.split-row b { color: var(--ink); font-family: var(--font-data); font-weight: 500; }
.split-bar { height: 12px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex; }
.split-bar div { height: 100%; min-width: 0; transition: flex-basis .25s; }
.msum-eq { display: grid; gap: 6px; margin-top: 6px; }
.fold[open] .msum-eq { display: none; }
.hatch { background: repeating-linear-gradient(135deg, var(--c-cash-dark) 0 2px, var(--c-cash) 2px 5px); }
.split-bar .sep { flex: 0 0 3px; background: var(--surface); }
@media (prefers-reduced-motion: reduce) { .split-bar div { transition: none; } }
.split-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted); }
.split-legend b { color: var(--ink); font-family: var(--font-data); font-weight: 500; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.person h3 { display: flex; align-items: center; gap: 6px; min-height: 24px; }
.person h3 small { margin-left: auto; }
.pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pen { flex: none; width: 22px; height: 22px; display: inline-grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; padding: 0; }
.rmp { flex: none; width: 22px; height: 22px; display: inline-grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; padding: 0; margin-left: auto; }
.rmp:hover { background: var(--bad-soft); color: var(--bad); }
.addp { border: 1px dashed var(--line); border-radius: 10px; background: transparent; color: var(--accent); font: 500 13.5px var(--font-body); padding: 12px; cursor: pointer; text-align: center; }
.addp:hover { border-color: var(--accent); background: var(--accent-soft); }
.people.solo { grid-template-columns: minmax(0, 1fr); }
.pen:hover { background: var(--accent-soft); color: var(--accent); }
.pname-edit { font: inherit; text-transform: none; letter-spacing: 0; font-family: var(--font-body); font-size: 13.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--accent); border-radius: 6px; padding: 2px 6px; width: 100%; max-width: 200px; }
.person h3 small { font-family: var(--font-data); font-weight: 400; text-transform: none; letter-spacing: 0; float: right; }
.person .num input { background: var(--surface); width: 100px; }

.field { padding: 10px 0 12px; border-top: 1px solid var(--line); min-width: 0; }
.duo .field:nth-child(-n+2), .fields > .field:first-child { border-top: 0; }
.frow { display: flex; justify-content: flex-start; align-items: center; gap: 6px 10px; flex-wrap: wrap; }
.frow label { font-size: 13.5px; font-weight: 500; }
.num { display: flex; align-items: baseline; gap: 4px; flex: none; margin-left: auto; }   /* reste à droite, même quand il passe à la ligne */
.num input { width: 110px; text-align: right; font-family: var(--font-data); font-size: 14px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font-variant-numeric: tabular-nums; }
.num input:disabled { opacity: .75; border-style: dashed; }
.num .unit { font-size: 12px; color: var(--muted); min-width: 34px; }
.frow label + .info { margin-left: -4px; }
.info { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--muted); background: transparent; color: var(--muted); font: italic 600 12px/1 Georgia, "Times New Roman", serif; cursor: pointer; padding: 0; }
.info:hover, .info[aria-expanded="true"] { border-color: var(--accent); color: var(--surface); background: var(--accent); }
.infobox { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); font-size: 13px; line-height: 1.5; max-width: 70ch; }
.infobox p { margin: 0 0 6px; }
.infobox ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 40px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-left: auto; flex: none; }
.seg button { width: 40px; border: 0; background: transparent; color: var(--muted); font: 500 12px/1 var(--font-data); padding: 5px 0; text-align: center; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.seg + .num { margin-left: 0; }
.pmode { margin-top: 6px; }
.seg-mode { grid-auto-columns: 64px; margin-left: 0; }
.seg-mode button { width: 64px; }
#gageBloc .frow { flex-wrap: nowrap; align-items: flex-start; }
#abBloc { border-top: 1px solid var(--line); margin: 12px 0; padding-top: 10px; }
#abBloc h3 { font-size: 13.5px; font-weight: 500; margin: 0 0 6px; }
.seg-lang { margin-left: 0; }
html:not([lang="fr"]) .seg-mode { grid-auto-columns: max-content; }
html:not([lang="fr"]) .seg-mode button { width: auto; padding: 5px 8px; }
.seg-ab { display: flex; flex-wrap: wrap; width: fit-content; margin-left: 0; }
.seg-ab button { width: auto; padding: 5px 10px; }
#ab-msg { margin-top: 6px; }
#gageBloc .check { border-top: 0; padding: 6px 0; }
#gageBloc .info { margin-top: 6px; }
.seg-usage { grid-auto-columns: auto; }
.seg-usage button { width: auto; padding: 5px 10px; }
#field-usage, #field-canton { border-top: 0; }
/* Sélecteur % / CHF et case du montant restent ensemble, à droite */
.ctl { display: flex; align-items: center; gap: 10px; margin-left: auto; flex: none; }
.ctl .seg, .ctl .num { margin-left: 0; }
.rwrap { position: relative; }
.rwrap:has(.casatax:not([hidden])) { padding-bottom: 16px; }
.casatax { position: absolute; top: 5px; left: calc(8px + var(--p) * (100% - 16px)); transform: translateX(-1px); pointer-events: none; display: grid; justify-items: start; gap: 1px; }
.casatax .tick { width: 2px; height: 24px; background: var(--warn); border-radius: 1px; }
.casatax .lbl { font: 500 11px/1.2 var(--font-data); color: var(--warn); white-space: nowrap; transform: translateX(-50%); }
@media print {
  .tabs, #tab-rates, #tab-al, .top-actions, .dossier-msg, .mbar, .lockbar, .btn, .pen, .rmp, .addp, .seg, .info, .infobox, input[type=range], .casatax, details.rules { display: none !important; }
  body { padding-block: 0; background: #fff; color: #000; }
  .grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "summary" "inputs" "details"; }
  .panel, .verdict { break-inside: avoid; }
  .fold > summary::after { display: none; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
.stackwrap { position: relative; margin-top: 22px; }
.eqmin { position: absolute; top: 2px; height: 46px; margin-left: -1px; border-left: 2px dashed var(--ink); pointer-events: none; }
.eqmin span { position: absolute; bottom: 100%; left: 0; transform: translateX(-50%); margin-bottom: 1px; font: 500 11px/1.2 var(--font-data); color: var(--ink); white-space: nowrap; }
.eqmin.bad { border-left-color: var(--bad); }
.eqmin.bad span { color: var(--bad); }
.subgroup { margin: -4px 0 10px 10px; padding-left: 14px; border-left: 2px solid var(--accent-soft); transition: opacity .2s; }
.subgroup .field:first-child { border-top: 0; padding-top: 4px; }
.subgroup.off, .field.off { opacity: .45; transition: opacity .2s; }
.subgroup.off .check { cursor: default; }
@media (prefers-reduced-motion: reduce) { .subgroup { transition: none; } }
.apport { padding: 4px 0 6px; }
.apport input[type=range] { accent-color: var(--c-eq); }
.apport-v { font-family: var(--font-data); font-weight: 500; font-size: 13.5px; font-variant-numeric: tabular-nums; color: var(--c-eq); }
#field-p3a1, #field-p3a2 { border-top: 0; padding-top: 0; }
.flabel { font-size: 13.5px; font-weight: 500; }
.ge-total { font-family: var(--font-data); font-weight: 500; font-size: 13.5px; font-variant-numeric: tabular-nums; }
#field-feesGe .check { border-top: 0; padding-bottom: 4px; }
.ge-detail { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 20px; }
.ge-col { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 12.5px; color: var(--muted); align-content: start; }
.ge-col h4 { grid-column: 1 / -1; margin: 4px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink); }
.ge-col b { font-family: var(--font-data); font-weight: 500; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.ge-col b:last-of-type, .ge-col span:nth-last-of-type(1) { font-weight: 600; }
.ge-detail .hint { grid-column: 1 / -1; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; text-decoration: underline; cursor: pointer; }
.brand-logo { height: 34px; width: auto; flex: none; }
.theme-foot { margin: 8px 0 0; font-size: 12px; color: var(--muted); text-align: center; }
.multi .gauge .mark, .multi .gauge .state { display: none; }
.multi .gauge .fill { background: var(--accent); }
.banks { display: grid; gap: 0; }
.banks h3 { margin: 4px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.bank { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.bank-name { font-weight: 600; }
.bank.own .bank-name small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.bank.own { background: var(--accent-soft); margin: 0 -10px; padding-inline: 10px; border-radius: 8px; border-top: 0; }
.bank .pill { font-size: 13px; padding: 3px 10px 3px 8px; }
.lg-info { display: inline-flex; align-items: center; gap: 6px; }
.lg-info .info { width: 17px; height: 17px; font-size: 11px; }
#info-loan { margin: 0 0 12px; }
.inote { font-size: 12px; font-weight: 400; color: var(--muted); }
.hint { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
input[type=range] { width: 100%; margin: 8px 0 0; accent-color: var(--accent); height: 18px; }
input[type=range]:disabled { opacity: .4; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.check span small { display: block; color: var(--muted); font-size: 12px; }
.tally { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 10px 0 12px; border-top: 1px solid var(--line); color: var(--muted); }
.tally b { color: var(--ink); font-family: var(--font-data); font-weight: 500; }
select.canton { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; }

/* Verdict */
.verdict { border-radius: 12px; padding: 18px; border: 1px solid var(--line); background: var(--surface); display: grid; gap: 14px; }
.vhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-stretch: 85%; font-weight: 700; font-size: 20px; padding: 6px 14px 6px 10px; border-radius: 999px; }
.pill::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.bad { color: var(--bad); background: var(--bad-soft); }
.vprice { text-align: right; }
.vprice .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.vprice .v { font-family: var(--font-data); font-size: 20px; font-weight: 500; }
.vkeys { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
@media (max-width: 460px) { .vkeys { grid-template-columns: 1fr; } }
.vkeys .k { font-size: 12px; color: var(--muted); }
.vkeys .v { font-family: var(--font-data); font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.vkeys small { display: block; font-size: 12px; color: var(--muted); }
.reasons { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--muted); }
.reasons:empty { display: none; }

.gauges { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
@media (max-width: 460px) { .gauges { grid-template-columns: 1fr; } }
.gauge { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
.gauge .gt { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12.5px; color: var(--muted); }
.gauge .gv { font-family: var(--font-data); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.gauge .gv small { font-size: 12px; color: var(--muted); font-weight: 400; }
.track { position: relative; height: 8px; border-radius: 4px; background: var(--line); overflow: visible; }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.track .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.st-ok .fill { background: var(--ok); } .st-ok .state { color: var(--ok); }
.st-warn .fill { background: var(--warn); } .st-warn .state { color: var(--warn); }
.st-bad .fill { background: var(--bad); } .st-bad .state { color: var(--bad); }

    const w1 = retraits(1), w2 = retraits(2), w = w1 + w2;
    o.taxChf1 ??= w > 0 ? o.taxChf * w1 / w : o.taxChf / 2;
    o.taxChf2 ??= w > 0 ? o.taxChf * w2 / w : o.taxChf / 2;
  }
  delete o.taxPct; delete o.taxChf;
}

function migrer(saved) {

  if (saved.cash != null && saved.cash1 == null) {
    Object.assign(saved, { cash1: saved.cash, p3a1: saved.p3a || 0, lpp1: saved.lpp || 0, cash2: 0, p3a2: 0, lpp2: 0 });
    delete saved.cash; delete saved.p3a; delete saved.lpp;

  if (saved.cantonMenage == null) saved.cantonMenage = saved.canton;
  // Canton absent de la liste : valeur par défaut
  for (const k of ["canton", "cantonMenage"]) if (!cantonConnu(saved[k])) delete saved[k];

  if (saved.alloc3 == null && saved.alloc != null) saved.alloc3 = saved.alloc;
  return saved;
}

  const gageEq = s.gageCompte ? m.gage2 + m.gage3 : 0, gageHard = s.gageCompte ? m.gage3 : 0;
  const Lmax = Math.min(Math.max(L, 0), gageEq > 0 ? Math.min(P, P * s.ltvMax / 100 + gageEq) : P * s.ltvMax / 100);
  const reqHard = Math.max(0, P * 0.10 - gageHard) + m.fees + s.reserve;
  const reqTotal = Math.max((P - Lmax) + m.fees + s.reserve, reqHard);
  return { reqIncome, reqTotal, reqHard, impossible: L < 0 };
}

/* ---------- Rendu ---------- */
// Plusieurs banques (config.banques) : leurs critères remplacent les hypothèses bancaires affichées
const BANKS = Array.isArray(CFG.banques) && CFG.banques.length ? CFG.banques : null;
// Gage compté : au-delà de ces seuils, le financement dépend de la banque
const gageAlerte = m => m.gageEq > 0 && m.ltv > GAGE_LTV.alerte / 100 ? t("msg.hypotheque_du_prix_au_dela", { ltv: pc(m.ltv), alerte: GAGE_LTV.alerte }) : null;
const gageTropHaut = m => m.gageEq > 0 && m.ltv > GAGE_LTV.max / 100;
// Bien gardé : les contrôles de fonds propres ne passent que grâce au montant emprunté
const okFonds = (m, minEq) => m.apport + m.gageEq >= minEq * m.P - 0.5 && m.hardPct * m.P >= 0.10 * m.P - 0.5;
const abEmpruntDecisif = (st, m, minEq) => m.ab.degage > 0 && okFonds(m, minEq) && !okFonds(model({ ...st, abMode: "aucun" }, m.P), minEq);
const AB_EMPRUNT_MSG = t("msg.les_fonds_propres_ne_passent");
// Verdict d'une situation donnée (les hypothèses d'une banque appliquées aux chiffres saisis)
function verdict(st) {
  st = effectif(st);   // après la fusion avec les hypothèses de la banque
  const m = model(st, st.price), lim = st.ratioMax / 100, minEq = 1 - st.ltvMax / 100;
  const okRatio = m.ratio <= lim, okEq = m.apport + m.gageEq >= minEq * m.P - 0.5, okHard = m.hardPct * m.P >= 0.10 * m.P - 0.5, okRet = m.ratioRet <= lim;
  const near = okRatio && m.ratio > lim - 0.015;
  const decisif = abEmpruntDecisif(st, m, minEq);
  const status = (!okRatio || !okEq || !okHard) ? "bad" : (!okRet || near || gageTropHaut(m) || decisif) ? "warn" : "ok";
  const why = [];
  if (!okRatio) why.push(t("msg.charges_au_dela_de", { ratio: pc(m.ratio), ratiomax: st.ratioMax }));
  else if (near) why.push(t("msg.charges_plafond", { ratio: pc(m.ratio), ratiomax: st.ratioMax }));
  if (!okEq) why.push(t("msg.fonds_propres_minimum", { eqpct: pc(m.eqPct), pc: pc(minEq, 0) }));
  if (!okHard) why.push(st.usage === "secondaire" ? t("msg.fonds_propres_durs_minimum_10", { hardpct: pc(m.hardPct) }) : t("msg.fonds_propres_hors_2e_pilier", { hardpct: pc(m.hardPct) }));
  if (!okRet) why.push(t("msg.charges_la_retraite", { ratioret: pc(m.ratioRet) }));
  if (gageAlerte(m)) why.push(gageAlerte(m));
  if (decisif) why.push(AB_EMPRUNT_MSG);
  return { status, why, alerte: [gageAlerte(m), decisif && AB_EMPRUNT_MSG].filter(Boolean).join(" ") || null };
}

function gauge(id, val, limit, scaleMax, text, sub, state) {
  if (BANKS) sub = "";   // les limites dépendent de chaque banque : seule la valeur est affichée
  const g = $(id);
  g.className = "gauge st-" + state;
  g.querySelector(".gv").innerHTML = text + (sub ? ` <small>${sub}</small>` : "");
  g.querySelector(".fill").style.width = Math.min(100, Math.max(0, val / scaleMax * 100)) + "%";
  g.querySelector(".mark").style.left = `calc(${Math.min(100, limit / scaleMax * 100)}% - 1px)`;
  g.querySelector(".state").textContent = { ok: t("msg.ok"), warn: t("msg.limite"), bad: t("msg.insuffisant") }[state];
}

    + (m.unused > 0 ? `<div class="lg"><i style="background:transparent;border:1px dashed var(--line)"></i><span>${t("msg.fonds_propres_non_utilises")}</span><b>${chf(m.unused)}</b></div>` : "")
    + (S.abMode !== "aucun" ? `<div class="lg"><i style="background:var(--c-ab)"></i><span>${t("html.autre_bien")}</span><b>${chf(abTotal)}</b></div>` : "")
    + (gageTotal > 0 ? `<div class="lg"><i style="background:transparent;border:1px solid var(--c-lpp)"></i><span>${t("html.mis_en_gage_hors_fonds")}</span><b>${chf(gageTotal)}</b></div>` : "")
    + (m.avail < 0 ? `<div class="lg"><i style="background:var(--bad)"></i><span>${t("msg.frais_non_couverts")}</span><b>${chf(-m.avail)}</b></div>` : "");

    ? (diff <= 0 ? t("msg.cout_reel_estime_par_mois_2", { chf: chf(tR / 12), abs: chf(Math.abs(diff)) }) : t("msg.cout_reel_estime_par_mois_3", { chf: chf(tR / 12), abs: chf(Math.abs(diff)) }))

  const am = tableauAmortissement(S, m);

  $("amortLignes").innerHTML = am.lignes.map(l => `<tr>${[l.annee, l.age].map(v => `<td>${v}</td>`).join("")}${[l.debut, l.interets, l.amort, l.fin, l.rang1, l.rang2].map(v => `<td>${nf.format(Math.round(v))}</td>`).join("")}<td>${l.pct.toFixed(1)}</td></tr>`).join("");

  drawChart(m, sol);
  drawRates();
  drawAcheterLouer(m);
  $("m-ratio").textContent = pc(m.ratio);
  $("m-pmax").textContent = short(sol.pMax);

// Dessin à la largeur réelle du graphique : le texte garde sa taille sur téléphone au lieu d'être réduit
function chartSize(svg, H0) {
  const w = Math.round(svg.parentElement.clientWidth), W = w > 0 ? Math.max(300, w) : 640, H = W < 560 ? Math.round(H0 * 0.8) : H0;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  return [W, H];
}
// Redessine quand la largeur d'un graphique change (rotation, redimensionnement, onglet affiché)
{
  const widths = new Map();
  let raf = 0;
  const ro = new ResizeObserver(entries => {
    let changed = false;
    // La largeur 0 (onglet caché) est aussi mémorisée : au retour sur l'onglet, le graphique est redessiné à la bonne largeur
    for (const en of entries) { const w = Math.round(en.contentRect.width); if (widths.get(en.target) !== w) { widths.set(en.target, w); if (w) changed = true; } }
    if (changed && !raf) raf = requestAnimationFrame(() => { raf = 0; update(); });
  });
  document.querySelectorAll(".chartwrap").forEach(el => ro.observe(el));
}
function niceStep(range, ticks) {
  const raw = range / ticks, p = Math.pow(10, Math.floor(Math.log10(raw)));
  return [1, 2, 2.5, 5, 10].map(x => x * p).find(x => x >= raw);
}
let CH = null;   // repères du dernier tracé, pour l'infobulle

// Infobulle : explique la pente de la courbe au prix survolé
function chartTip(e) {
  if (!CH) return;
  const svg = $("chart"), r = svg.getBoundingClientRect(), wrap = svg.parentElement.getBoundingClientRect();
  const vx = (e.clientX - r.left) * CH.W / r.width;
  const tip = $("ctip");
  if (vx < CH.L || vx > CH.W - CH.R) { hideTip(); return; }
  const P = Math.max(1000, (vx - CH.L) / (CH.W - CH.L - CH.R) * CH.xMax);
  const m = model(S, P);
  let zone, why;
  if (m.loan <= 0) {
    zone = t("msg.pas_hypotheque");
    why = t("msg.votre_apport_couvre_tout_le", { maintpct: S.maintPct });
  } else if (m.rank2 <= 0) {
    zone = t("msg.1_er_rang_seulement");
    why = t("msg.chaque_franc_emprunte_coute_interets", { rate: S.rate });
  } else {
    zone = t("msg.avec_un_2_rang");
    why = t("msg.hypotheque_depasse_du_prix_la", { rank1pct: effectif(S).rank1Pct, rate: S.rate, years: m.years, tofixed: (100 / m.years).toFixed(1) });
  }
  const warn = P > CH.pEqLim ? `<p class="ctip-bad">${t("msg.fonds_propres_insuffisants_ce_prix")}</p>` : "";
  tip.innerHTML = `<b>${chf(P)} → ${pc(m.ratio)}</b><span class="ctip-zone">${zone}</span><p>${why}</p>${warn}`;
  tip.hidden = false;
  // Ligne verticale de survol
  let hl = svg.querySelector("#hoverline");
  if (!hl) { hl = document.createElementNS("http://www.w3.org/2000/svg", "line"); hl.id = "hoverline"; hl.setAttribute("class", "hover"); svg.appendChild(hl); }
  const yv = Math.min(m.ratio, CH.yMax);
  hl.setAttribute("x1", vx); hl.setAttribute("x2", vx); hl.setAttribute("y1", CH.Y(yv)); hl.setAttribute("y2", CH.H - CH.B);
  // Position : à côté du curseur, sans sortir du cadre
  placeTip(tip, wrap, e);
}
function hideTip() {
  $("ctip").hidden = true;
  const hl = $("chart").querySelector("#hoverline"); if (hl) hl.remove();
}
// Souris : à côté du curseur. Tactile : au-dessus du graphique (ou en dessous faute de place), pour ne pas être caché par le doigt.
function placeTip(tip, wrap, e) {
  const tw = tip.offsetWidth, th = tip.offsetHeight, x = e.clientX - wrap.left;
  if (e.pointerType === "touch") {
    tip.style.left = Math.max(0, Math.min(x - tw / 2, wrap.width - tw)) + "px";
    tip.style.top = (wrap.top - th - 8 > 0 ? -th - 8 : wrap.height + 8) + "px";
    return;
  }
  tip.style.left = Math.max(0, Math.min(x + 14 + tw > wrap.width ? x - 14 - tw : x + 14, wrap.width - tw)) + "px";
  tip.style.top = Math.max(0, e.clientY - wrap.top - 20) + "px";
}
// Tactile : toucher ou glisser horizontalement sur le graphique ; l'infobulle reste affichée jusqu'à un toucher ailleurs.
function chartEvents(svg, show, hide) {
  svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointermove", show);
  svg.addEventListener("pointerleave", e => { if (e.pointerType !== "touch") hide(e); });
  document.addEventListener("pointerdown", e => { if (!svg.contains(e.target)) hide({ currentTarget: svg }); });
}
chartEvents($("chart"), chartTip, hideTip);

function drawChart(m, sol) {
  const [W, H] = chartSize($("chart"), 300), L = 62, R = 16, T = 12, B = 48;
  const lim = S.ratioMax / 100;
  const pEqLim = Math.min(sol.pEq, sol.pHard);
  const xMaxRaw = Math.max(m.P, sol.pInc, Math.min(pEqLim, m.P * 2.5)) * 1.25;
  const xs = niceStep(xMaxRaw, 5), xMax = Math.ceil(xMaxRaw / xs) * xs;
  const yMax = Math.max(0.6, Math.ceil(Math.min(1, m.ratio * 1.1) * 10) / 10);
  const X = v => L + v / xMax * (W - L - R), Y = v => T + (1 - Math.min(v, yMax) / yMax) * (H - T - B);
  let o = "";
  for (let y = 0; y <= yMax + 1e-9; y += 0.1) o += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(y)}" y2="${Y(y)}"/><text x="${L - 8}" y="${Y(y) + 4}" text-anchor="end">${Math.round(y * 100)}%</text>`;
  for (let x = 0; x <= xMax + 1; x += xs) o += `<text x="${X(x)}" y="${H - B + 18}" text-anchor="middle">${x === 0 ? "0" : short(x)}</text>`;
  if (pEqLim < xMax) o += `<rect class="noeq" x="${X(pEqLim)}" y="${T}" width="${W - R - X(pEqLim)}" height="${H - T - B}"/><text class="lbl-bad" x="${W - R - 6}" y="${T + 14}" text-anchor="end">${t("msg.fonds_propres_insuffisants")}</text>`;
  // La courbe s'arrête au bord haut du graphique au lieu de faire un plateau.
  let endX = X(xMax);
  const curve = (st, track) => {
    const pts = [];
    let prevP = 1000, prevR = model(st, prevP).ratio;
    for (let i = 0; i <= 120; i++) {
      const P = Math.max(1000, xMax * i / 120), r = model(st, P).ratio;
      if (r > yMax) {
        const Pc = prevR < yMax ? prevP + (P - prevP) * (yMax - prevR) / (r - prevR) : prevP;
        pts.push([X(Pc), Y(yMax)]);
        if (track) endX = X(Pc);
        break;
      }
      pts.push([X(P), Y(r)]); prevP = P; prevR = r;
    }
    return pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
  };
  const path = curve(S, true);
  o += `<path class="area" d="${path}L${endX} ${Y(0)}L${X(0)} ${Y(0)}Z"/>`;
  // Apport réduit par le curseur : on montre aussi la courbe « tout investi », celle du prix maximum
  const partial = S.apportSel != null;
  if (partial) o += `<path class="curve-all" d="${curve({ ...S, apportSel: null })}"/>`;
  o += `<path class="curve" d="${path}"/>`;
  o += `<line class="limit" x1="${L}" x2="${W - R}" y1="${Y(lim)}" y2="${Y(lim)}"/><text class="lbl-bad halo" x="${L + 6}" y="${Y(lim) + 15}">${t("msg.plafond", { ratiomax: S.ratioMax })}</text>`;
  // Le trait du maximum s'arrête sur la courbe « tout investi »
  const yTop = Y(Math.min(model({ ...S, apportSel: null }, sol.pMax).ratio, yMax));
  const showMax = sol.pMax > 0 && sol.pMax < xMax;
  if (showMax) o += `<line class="pmax" x1="${X(sol.pMax)}" x2="${X(sol.pMax)}" y1="${yTop}" y2="${H - B}"/><text class="lbl-ok halo" x="${X(sol.pMax) + (X(sol.pMax) > W - 170 ? -5 : 5)}" y="${H - B - 8}" text-anchor="${X(sol.pMax) > W - 170 ? "end" : "start"}">${partial ? t("msg.max_tout_investi", { pmax: short(sol.pMax) }) : t("msg.max_2", { pmax: short(sol.pMax) })}</text>`;
  const cx = X(m.P), cy = Y(m.ratio);
  o += `<line class="now" x1="${cx}" x2="${cx}" y1="${cy}" y2="${H - B}" stroke-dasharray="3 3"/><circle class="dot" cx="${cx}" cy="${cy}" r="6"/>`;
  // Étiquette du point du côté opposé à la ligne du maximum
  const left = (sol.pMax > m.P && cx > L + 130) || cx > W - 160;
  o += `<text class="lbl-ink halo" x="${cx + (left ? -10 : 10)}" y="${Math.max(T + 12, cy - 10)}" text-anchor="${left ? "end" : "start"}">${short(m.P)} → ${pc(m.ratio)}</text>`;
  o += `<line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
  // Titres des axes
  o += `<text class="axis-title" x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">${t("msg.prix_achat_chf")}</text>`;
  o += `<text class="axis-title" transform="translate(13 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle">${t("msg.taux_effort_du_revenu")}</text>`;
  $("chart").innerHTML = o;
  // Légende sous le graphique, hors du tracé
  const items = [
    `<span><i class="lg-line"></i>${partial ? t("msg.votre_apport") : t("msg.taux_effort_avec_votre_apport")}</span>`,
    partial ? `<span><i class="lg-line lg-dash"></i>${t("msg.tout_investi")}</span>` : ""
  ];
  $("chartLegend").innerHTML = items.join("");
  CH = { L, R, W, T, B, H, xMax, yMax, pEqLim, X, Y };
}

/* ---------- Onglet : mensualités selon les taux ---------- */
// Part financée de l'onglet, en % du prix : 80 % en principale, quel que soit le réglage ltvMax ; ltvMaxSec en secondaire
const ltvOnglet = () => S.usage === "secondaire" ? S.ltvMaxSec : 80;
// Hypothèque à la part financée du prix, 2e rang amorti sur la durée maximale
function monthly(P) {
  const loan = P * ltvOnglet() / 100, rank1 = Math.min(loan, P * effectif(S).rank1Pct / 100), amort = (loan - rank1) / S.amortMax, maint = P * S.maintPct / 100;
  return { loan, amort, maint, theo: (loan * S.gRate / 100 + amort + maint) / 12, real: (loan * S.gReal / 100 + amort + maint) / 12 };
}
// Fonds propres minimum : la part non financée du prix plus les frais d'achat
function minEquity(P) {
  const fees = P * S.gFees / 100, part = P * (100 - ltvOnglet()) / 100;
  return { part, fees, total: part + fees };
}

// Graphique en lignes en fonction du prix, avec infobulle au survol
const LC = {};
function lineChart(id, { f, series, yTitle, tip, xMin, xMax, xTitle = t("msg.prix_du_bien_chf"), xFmt = x => x === 0 ? "0" : short(x), xPas = 10000, xTip = x => t("msg.prix", { x: chf(x) }), points = 60, plage }) {
  const [W, H] = chartSize($(id), 340), L = 64, R = 16, T = 34, B = 52;
  if (!(xMax > xMin)) xMax = xMin + 100000;
  const xs0 = niceStep(xMax - xMin, 5);
  // plage : bornes verticales données par l'appelant, pour une courbe non croissante ou négative
  const end = f(xMax), yRaw = plage ? plage.max : Math.max(...series.map(sr => end[sr.key])), yBas = plage ? plage.min : 0, ys = niceStep(yRaw - yBas, 5), yMin = Math.floor(yBas / ys) * ys, yMax = Math.ceil(yRaw / ys) * ys;
  const X = v => L + (v - xMin) / (xMax - xMin) * (W - L - R), Y = v => T + (1 - (v - yMin) / (yMax - yMin)) * (H - T - B);
  let o = "";
  for (let y = yMin; y <= yMax + 1e-9; y += ys) o += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(y)}" y2="${Y(y)}"/><text x="${L - 8}" y="${Y(y) + 4}" text-anchor="end">${y === 0 ? "0" : y >= 1e5 ? short(y) : nf.format(y)}</text>`;
  for (let x = Math.ceil(xMin / xs0) * xs0; x <= xMax + 1; x += xs0) o += `<text x="${X(x)}" y="${H - B + 20}" text-anchor="middle">${xFmt(x)}</text>`;
  o += `<text class="lbl-ink" x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">${xTitle}</text>`;
  o += `<text class="lbl-ink" x="${L}" y="${T - 16}">${yTitle}</text>`;
  for (const sr of series) o += `<path style="fill:none;stroke:${sr.color};stroke-width:2.5" d="${Array.from({ length: points + 1 }, (_, i) => { const P = xMin + (xMax - xMin) * i / points; return (i ? "L" : "M") + X(P).toFixed(1) + " " + Y(f(P)[sr.key]).toFixed(1); }).join("")}"/>`;
  o += `<line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
  $(id).innerHTML = o;
  $(id).parentElement.nextElementSibling.innerHTML = [...series].sort((p, q) => end[q.key] - end[p.key])
    .map(sr => `<span><i style="background:${sr.color}"></i>${sr.label}</span>`).join("");
  LC[id] = { L, R, W, H, T, B, xMin, xMax, X, Y, f, series, tip, xPas, xTip };
}
function lineTip(e) {
  const svg = e.currentTarget, c = LC[svg.id]; if (!c) return;
  const r = svg.getBoundingClientRect(), wrap = svg.parentElement.getBoundingClientRect(), tipEl = svg.nextElementSibling;
  const vx = (e.clientX - r.left) * c.W / r.width;
  if (vx < c.L || vx > c.W - c.R) { lineHide(e); return; }
  const P = Math.round((c.xMin + (vx - c.L) / (c.W - c.L - c.R) * (c.xMax - c.xMin)) / c.xPas) * c.xPas, v = c.f(P);
  tipEl.innerHTML = `<b>${c.xTip(P)}</b><dl>${c.tip(P, v)}</dl>`;
  tipEl.hidden = false;
  let g = svg.querySelector(".hovering");
  if (!g) { g = document.createElementNS("http://www.w3.org/2000/svg", "g"); g.setAttribute("class", "hovering"); svg.appendChild(g); }
  const x = c.X(P);
  g.innerHTML = `<line class="hover" x1="${x}" x2="${x}" y1="${c.T}" y2="${c.H - c.B}"/>`
    + c.series.map(sr => `<circle style="fill:${sr.color};stroke:var(--surface);stroke-width:2" cx="${x}" cy="${c.Y(v[sr.key])}" r="5"/>`).join("");
  placeTip(tipEl, wrap, e);
}
function lineHide(e) {
  const svg = e.currentTarget;
  svg.nextElementSibling.hidden = true;
  const g = svg.querySelector(".hovering"); if (g) g.remove();
}
for (const id of ["rchart", "echart", "alchart"]) chartEvents($(id), lineTip, lineHide);

function drawRates() {
  const range = (lo, hi) => t("msg.prix_2", { lo: short(lo), short: short(hi > lo ? hi : lo + 100000) });
  const ltv = ltvOnglet(), N = Math.round(100 - ltv);
  $("r-apport").textContent = t("msg.apport_de", { n: N });
  $("r-ltv").textContent = ltv;
  $("e-apport").textContent = N;
  lineChart("rchart", {
    f: monthly, yTitle: t("msg.charges_mensuelles_chf_mois"), xMin: S.gMin, xMax: S.gMax,

let LAST = null, DL = null;
function loadJsPDF() {
  if (window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload = () => res(window.jspdf.jsPDF); s.onerror = rej;
    document.head.appendChild(s);
  });
}
// Texte compatible avec les polices standard du PDF
const tx = s => String(s).replace(/[  ]/g, " ").replace(/[’‘]/g, "'").replace(/[–—]/g, "-").replace(/<[^>]+>/g, "");
const chfT = v => tx(chf(v));

// Logo SVG → image PNG pour le PDF ; retourne null si le navigateur refuse la conversion
async function logoForPdf() {
  if (!TH?.logoSvg) return null;
  try {
    const img = new Image();
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(TH.logoSvg);
    await img.decode();
    const vb = (TH.logoSvg.match(/viewBox="([^"]+)"/) || [])[1]?.split(/[\s,]+/).map(Number) || [0, 0, 4, 1];
    const ratio = vb[2] / vb[3], h = 160, w = Math.round(h * ratio), pad = 40;
    const c = document.createElement("canvas");
    c.width = w + pad * 2; c.height = h + pad * 2;
    const ctx = c.getContext("2d");
    ctx.fillStyle = TH.logoFond || "#1B1B1B"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, pad, pad, w, h);
    return { data: c.toDataURL("image/png"), ratio: c.width / c.height };
  } catch (e) { return null; }
}

    if (!am.lignes.length) para(amortSynthese(am));
    else {
      row(t("msg.dette_la_retraite"), chfT(am.detteRetraite), true);
      row(t("msg.interets_reels_jusqu_la_retraite"), chfT(am.totalInterets));
      row(t("msg.amorti_jusqu_la_retraite"), chfT(am.totalAmorti));
      // Tableau annuel, avec ses titres répétés à chaque page
      const X = [L, 36, 66, 88, 110, 138, 162, 180, R], titres = [t("msg.annee_3"), t("msg.age"), t("msg.dette_debut"), t("msg.interets_2"), t("msg.amort"), t("msg.dette_fin"), t("msg.1er_rang_2"), t("msg.2e_rang_2"), t("msg.prix_4")];
      const ligne = (cells, bold) => { doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(bold ? 7.5 : 8.5); doc.setTextColor(...(bold ? MUTED : INK)); cells.forEach((c, i) => doc.text(tx(c), X[i], y, i ? { align: "right" } : undefined)); y += 4.4; };
      ensure(14); y += 1.5; ligne(titres, true);
      am.lignes.forEach(l => {
        if (y + 4.4 > 282) { doc.addPage(); y = 18; ligne(titres, true); }
        ligne([l.annee, l.age, ...[l.debut, l.interets, l.amort, l.fin, l.rang1, l.rang2].map(v => nf.format(Math.round(v))), l.pct.toFixed(1)].map(String));
      });
      y += 2;
    }
    para(amortHypotheses(S));

    if (!sec && S.abMode !== "conserve") {
      const al = acheterLouer(S, m);
      section(t("html.acheter_ou_louer"));
      alMessages(S, m, LAST.status).forEach(t => para(t));
      row(t("msg.patrimoine_ans_en_achetant", { n: al.N }), chfT(al.acheter), true);
      row(t("msg.patrimoine_ans_en_louant", { n: al.N }), chfT(al.louer), true);
      row(t("msg.ecart_acheter_moins_louer"), chfT(al.ecart));
      row(t("msg.acheter_passe_durablement_devant"), alSeuil(al, m));
      para(t("msg.hausse_des_loyers_an_du", { alhausseloyer: S.alHausseLoyer, alhaussebien: S.alHausseBien, alrendement: S.alRendement, alfraisvente: S.alFraisVente, al: alHypotheses(S, m, al) }));
      para(alBiais(S, al));
      para($("al-limites").textContent);
    }

    if (LAST.banks) {
      section(t("msg.selon_les_banques"));
      const lab = { ok: t("msg.ok"), warn: t("msg.la_limite"), bad: t("msg.pas_ok") };
      LAST.banks.forEach(b => { row(b.nom, lab[b.status], b.status === "ok"); if (b.alerte) para(b.alerte); });
    } else {
      section(t("msg.hypotheses"));
      row(t("msg.taux_theorique_plafond_des_charges"), `${S.rate} % / ${S.ratioMax} %`);
      row(t("msg.limite_1er_rang_financement_max"), `${E.rank1Pct} % / ${E.ltvMax} %`);
      row(t("msg.age_de_la_retraite_revenu"), t("msg.ans_6", { retireage: S.retireAge, retirepct: S.retirePct }));
    }

    section(t("msg.ce_qui_est_possible"));
    row(sol.by === "revenus" ? t("msg.prix_maximum_limite_par_vos") : sol.by === "fonds" ? t("msg.prix_maximum_limite_par_vos_2") : t("msg.prix_maximum_limite_par_vos_3"), chfT(sol.pMax), true);
    const dTx = d => d >= 0 ? t("msg.marge_2", { abs: chfT(Math.abs(d)) }) : t("msg.manque_2", { abs: chfT(Math.abs(d)) });
    row(t("msg.revenu_annuel_minimum_pour_ce"), `${chfT(req.reqIncome)}  (${dTx(income(S) - req.reqIncome)})`);
    if (req.impossible) row(t("msg.fonds_propres_minimum_frais_inclus"), t("msg.hors_de_portee"));
    else {
      row(t("msg.fonds_propres_minimum_frais_inclus"), `${chfT(req.reqTotal)}  (${dTx(m.eq.total - req.reqTotal)})`);
      row(t("msg.dont_fonds_propres_durs_minimum"), `${chfT(req.reqHard)}  (${dTx(m.eq.hard - req.reqHard)})`);
    }

    y += 4;
    if (TXT.avertissementPdf) para(String(TXT.avertissementPdf).replace(/\*\*/g, ""), MUTED, 8.5);
    // Pied de page sur chaque page : filet (sable avec un thème), nom et numéro de page
    {
      const n = doc.getNumberOfPages();
      for (let i = 1; i <= n; i++) {
        doc.setPage(i);
        doc.setDrawColor(...(BRAND || LINE)); doc.setLineWidth(0.4); doc.line(L, 288, R, 288);
        doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...MUTED);
        doc.text(tx(TH?.nom || t("html.simulateur_hypothecaire_suisse")), L, 292);
        doc.text(`${i} / ${n}`, R, 292, { align: "right" });
      }
    }

    const name = `simulation-hypotheque-${new Date().toISOString().slice(0, 10)}.pdf`;
    await telecharger(name, doc.output("blob"));
    btn.textContent = old;
  } catch (e) {
    btn.textContent = e && e.code === "declined" ? old : t("msg.export_indisponible");
    if (btn.textContent !== old) setTimeout(() => { btn.textContent = old; }, 2500);
  } finally {
    btn.disabled = false;
  }
}
$("export").addEventListener("click", exportPdf);
// Dans claude.ai : téléchargement via la capacité downloads. Fichier ouvert seul : téléchargement direct.
const STANDALONE = !(window.claude && window.claude.use);
if (STANDALONE) { canExport = true; syncExport(); }
else window.claude.use("downloads").then(d => { DL = d; canExport = !!d; syncExport(); }).catch(() => {});

if (BANKS) {
  $("reasons").hidden = true;
  $("hyp-lead").textContent = t("msg.vos_propres_hypotheses_elles_servent");
  $("banks").hidden = false;
  document.querySelector(".verdict").classList.add("multi");
  document.querySelector(".brand .sub").innerHTML = fmtTxt(t("msg.votre_projet_compare_aux_criteres", { length: BANKS.length }));
}
// Conseillers (config.conseillers) : menu en haut à droite, nom repris dans le PDF
const ADVISORS = Array.isArray(CFG.conseillers) ? CFG.conseillers : [];
if (ADVISORS.length) {
  const sel = $("conseiller");
  sel.innerHTML = `<option value="">${t("msg.conseiller")}</option>` + ADVISORS.map(a => `<option value="${esc(a.nom)}">${esc(a.nom)}</option>`).join("");
  sel.value = ADVISORS.some(a => a.nom === S.conseiller) ? S.conseiller : "";
  sel.hidden = false;
  sel.addEventListener("change", () => { S.conseiller = sel.value; update(); });
}

// Onglet « Ma config » : vue en lecture seule des banques et conseillers configurés (absent sans eux)
if (BANKS || ADVISORS.length) {
  // Titre de section avec un (i) qui indique le fichier à modifier
  const head = (titre, id, texte) => `<h2 class="cfg-h">${titre} <button type="button" class="info" aria-controls="info-${id}" aria-expanded="false" aria-label="${t("attr.ou_modifier", { titre: titre })}">i</button></h2>
    <div class="infobox" id="info-${id}" hidden>${texte}</div>`;
  // Tableau en deux parties : colonne du nom fixe, autres colonnes dans une zone qui défile (barre de défilement sous cette zone seulement)
  const splitTable = (heads, rows) => {
    const part = (from, to) => `<table class="costs cfg"><thead><tr>${heads.slice(from, to).map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>`
      + rows.map(r => `<tr class="${r.cls || ""}">${r.cells.slice(from, to).map((c, i) => `<td class="${(r.cellCls || [])[from + i] || ""}">${c}</td>`).join("")}</tr>`).join("")
      + `</tbody></table>`;
    return `<div class="cfg-split"><div class="cfg-fixed">${part(0, 1)}</div><div class="tablewrap cfg-scroll">${part(1)}</div></div>`;
  };
  const val = (v, u) => v === undefined || v === null || v === "" ? "–" : `${esc(String(v))}${u ? "&nbsp;" + u : ""}`;
  let html = "";
  if (BANKS) {
    const cols = [["rate", t("msg.taux_theorique"), "%"], ["ratioMax", t("msg.charges_max"), "%"], ["ltvMax", t("msg.financement_max"), "%"], ["ltvMaxSec", t("msg.financement_max_secondaire"), "%"], ["rank1Pct", t("msg.limite_1_er_rang"), "%"], ["rank1PctSec", t("msg.limite_1_er_rang_secondaire"), "%"],
      ["amortMax", t("msg.amort_2_rang"), t("msg.ans")], ["maintPct", t("msg.entretien"), "%"], ["retireAge", t("msg.retraite"), t("msg.ans")], ["retirePct", t("msg.revenu_la_retraite"), "%"]];
    const row = (nom, b, ref) => ({ cls: ref ? "ref" : "", cells: [nom, ...cols.map(([k, , u]) => val(b[k] ?? DEFAULTS[k], u))],
      cellCls: ["", ...cols.map(([k]) => !ref && b[k] === undefined ? "inh" : "")] });
    html += `<section class="panel">${head(t("msg.banques_comparees"), "cfg-banques", t("msg.pour_ajouter_retirer_ou_modifier"))}
      <p class="lead">${t("msg.criteres_utilises_pour_le_verdict")}</p>
      ${splitTable([t("msg.banque"), ...cols.map(c => c[1])], [row(t("msg.hypotheses_bancaires_reference"), DEFAULTS, true), ...BANKS.map(b => row(esc(b.nom), b, false))])}</section>`;
  }
  if (ADVISORS.length) {
    html += `<section class="panel">${head(t("msg.conseillers"), "cfg-conseillers", t("msg.pour_ajouter_retirer_ou_modifier_2"))}${splitTable([t("msg.nom"), t("msg.fonction"), t("msg.mail"), t("msg.telephone")],
      ADVISORS.map(a => ({ cells: [esc(a.nom), val(a.fonction), val(a.email), val(a.telephone)] })))}</section>`;
  }
  html += `<section class="panel"><h2>${t("msg.fichiers_de_configuration")}</h2>
    <p class="lead">${t("msg.pour_modifier_ces_reglages_editez")}</p>
    <ul class="cfg-files">${(window.SIMU_CONFIG_FICHIERS || []).map(n => `<li><code>config/${esc(n)}.js</code></li>`).join("")}</ul></section>`;
  $("tab-config").innerHTML = html;
  $("t-config").hidden = false;
  try { if (localStorage.getItem(KEY + "-tab") === "config") showTab("config"); } catch (e) {}
}
$("casataxTxt").textContent = CED_RED === 0.5 ? t("msg.achat_au_plus_habite_au", { casatax: chf(CASATAX), casatax_red: chf(CASATAX_RED) }) : t("msg.achat_au_plus_habite_au_2", { casatax: chf(CASATAX), casatax_red: chf(CASATAX_RED), ced_red: CED_RED * 100 });
// Changer de langue recharge la page. L'état passe par window.name, ce qui marche aussi quand localStorage est bloqué.
const LANGUE_ETAT = "simu-hypo-langue:";
function changerLangue(l) {
  let memo = false;
  try { localStorage.setItem(LANGUE_MEMO, l); memo = localStorage.getItem(LANGUE_MEMO) === l; } catch (e) {}
  window.name = LANGUE_ETAT + JSON.stringify({ S, touched, tab: TAB });
  const u = new URL(location.href);
  if (u.searchParams.has("lang") || !memo) u.searchParams.set("lang", l);
  if (u.href === location.href) location.reload(); else location.replace(u.href);
}
const langues = LANGUES.filter(langueDispo);
if (langues.length > 1) {
  document.querySelector(".top-actions").insertAdjacentHTML("afterbegin", `<span class="seg seg-lang" role="group" aria-label="${t("langue.choix")}">${langues.map(l => `<button type="button" data-lang="${l}" aria-pressed="${l === LANGUE}">${l.toUpperCase()}</button>`).join("")}</span>`);
  document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { if (b.dataset.lang !== LANGUE) changerLangue(b.dataset.lang); }));
}
if (t("langue.bandeau")) document.querySelector(".top").insertAdjacentHTML("afterend", `<p class="note" id="langueNote">${fmtTxt(t("langue.bandeau"))}</p>`);
if (window.name.startsWith(LANGUE_ETAT)) {
  try {
    const e = JSON.parse(window.name.slice(LANGUE_ETAT.length));
    S = { ...DEFAULTS, ...nettoyer(e.S).sur };
    touched = !!e.touched;
    if ($("t-" + e.tab) && !$("t-" + e.tab).hidden) showTab(e.tab);
  } catch (e) {}
  window.name = "";
}
update();
</script>

</body></html>
